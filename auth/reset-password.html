<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Restablecer contraseña · Manifiesto</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    background: #0E3A26;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #FFFBF2; text-align: center; padding: 28px;
  }
  .card { max-width: 420px; }
  .wordmark { font-size: 34px; font-weight: 800; letter-spacing: -1.5px; }
  .wordmark span { color: #F2B58A; }
  h1 { font-size: 22px; font-weight: 700; margin-top: 28px; letter-spacing: -0.3px; }
  p { font-size: 15px; line-height: 1.55; color: rgba(255,251,242,0.65); margin-top: 12px; }
  .cta {
    display: inline-block; margin-top: 26px;
    background: #FFFBF2; color: #0E3A26; text-decoration: none;
    font-size: 15px; font-weight: 700;
    padding: 15px 32px; border-radius: 16px;
  }
  .hint { font-size: 12px; color: rgba(255,251,242,0.4); margin-top: 22px; }
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark">Manifiesto<span>.</span></div>
    <h1>Restablece tu contraseña</h1>
    <p>Abre Manifiesto para crear tu contraseña nueva. Si no se abre sola, toca el botón.</p>
    <a class="cta" id="open-app" href="#">Abrir Manifiesto</a>
    <p class="hint">¿No tienes la app instalada? Descárgala desde el App Store y vuelve a tocar el link del email.</p>
  </div>
  <script>
    // El link del email de Supabase llega aquí vía 302 con ?code=... (PKCE).
    // iOS no dispara Universal Links desde redirects, así que esta landing
    // rebota a la app con el scheme, preservando el query string completo.
    // El intento automático funciona en la mayoría de los casos; el botón
    // cubre el resto (el tap de usuario siempre habilita el handoff).
    //
    // Desktop: no hay app que abrir — el code PKCE solo lo puede canjear
    // la app que inició el reset, así que aquí solo guiamos al teléfono.
    (function () {
      var isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
      if (!isMobile) {
        document.getElementById('open-app').style.display = 'none';
        document.querySelector('p').textContent =
          'Abriste este link en una computadora. Abre el email desde tu teléfono (donde está instalada la app Manifiesto) y toca el link ahí.';
        document.querySelector('.hint').textContent =
          'El link de recuperación solo puede completarse desde la app.';
        return;
      }
      var target = 'manifiesto://auth/reset-password' + window.location.search;
      document.getElementById('open-app').setAttribute('href', target);
      window.location.replace(target);
    })();
  </script>
</body>
</html>
